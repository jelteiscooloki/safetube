<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAFETUBE — Watch what matters</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--text:#172033;--muted:#718096;--line:#e6eaf1;--blue:#246bfe;--blue2:#eaf1ff;--nav:#101a31;--shadow:0 8px 30px #1720330b}
[data-theme=dark]{--bg:#0c1322;--panel:#151f32;--text:#eef3ff;--muted:#9ba9bf;--line:#26344b;--blue:#6c9bff;--blue2:#1c3158;--nav:#080e19;--shadow:0 8px 30px #0003}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}
.top{height:68px;position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 24px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:20px;letter-spacing:-.7px;white-space:nowrap}.brandmark{width:34px;height:26px;background:var(--blue);border-radius:9px;display:grid;place-items:center;color:white}.brandmark:after{content:"";border-left:10px solid white;border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}.search{display:flex;max-width:650px;flex:1;margin:auto}.search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px 0 0 12px;padding:11px 15px;color:var(--text);outline:none}.search button{background:var(--blue2);color:var(--blue);padding:0 19px;border-radius:0 12px 12px 0;font-weight:700}.top-actions{display:flex;align-items:center;gap:9px}.iconbtn,.avatar{background:var(--bg);color:var(--text);border:1px solid var(--line);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:700}.avatar{border-radius:50%;background:var(--blue);color:#fff;border:0}.layout{display:flex;min-height:calc(100vh - 68px)}aside{width:238px;flex-shrink:0;padding:20px 13px;border-right:1px solid var(--line);background:var(--panel);height:calc(100vh - 68px);position:sticky;top:68px;overflow:auto}.navlabel{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1.2px;padding:12px 12px 7px}.navitem{display:flex;align-items:center;gap:13px;padding:10px 12px;border-radius:11px;color:var(--muted);font-weight:600;margin:2px 0}.navitem:hover,.navitem.active{background:var(--blue2);color:var(--blue)}.navitem span:first-child{width:20px;text-align:center;font-size:17px}.sidefoot{border-top:1px solid var(--line);margin-top:18px;padding:16px 10px;color:var(--muted);font-size:12px}
main{flex:1;min-width:0;padding:28px clamp(18px,3vw,44px) 60px;max-width:1700px;margin:auto;width:100%}.pagehead{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-bottom:22px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:1.5px}.pagehead h1{font-size:29px;letter-spacing:-1px;margin:3px 0}.sub{color:var(--muted);margin:0}.chips{display:flex;gap:8px;overflow:auto;padding:3px 0 18px}.chip{white-space:nowrap;padding:8px 14px;border-radius:30px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:650}.chip.active,.chip:hover{background:var(--nav);color:white;border-color:var(--nav)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:25px 18px}.video-card{min-width:0;cursor:pointer}.thumb{aspect-ratio:16/9;border-radius:15px;overflow:hidden;background:linear-gradient(135deg,#172d56,#427cf3);position:relative;display:grid;place-items:center;color:#fff}.thumb img,.thumb video{width:100%;height:100%;object-fit:cover}.thumb .play{font-size:34px;filter:drop-shadow(0 3px 5px #0008)}.duration{position:absolute;right:9px;bottom:8px;background:#0b1225d9;color:#fff;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:800}.video-meta{display:flex;gap:11px;padding-top:11px}.channel-avatar{width:37px;height:37px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:var(--blue2);color:var(--blue);font-weight:800}.video-title{font-weight:750;line-height:1.35;margin:0 0 5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.muted{color:var(--muted);font-size:13px}.empty{background:var(--panel);border:1px dashed var(--line);border-radius:18px;padding:50px 20px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:5px}.btn{padding:10px 15px;border-radius:11px;background:var(--blue);color:#fff;font-weight:750}.btn.secondary{background:var(--blue2);color:var(--blue)}.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}.btn.danger{background:#fff0f0;color:#d34b4b}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.watch{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:25px}.player{width:100%;aspect-ratio:16/9;background:#070b13;border-radius:16px;overflow:hidden;display:grid;place-items:center}.player video{width:100%;height:100%;max-height:70vh}.watch h2{font-size:23px;line-height:1.3;margin:14px 0}.desc{white-space:pre-wrap;background:var(--bg);border-radius:13px;padding:15px;margin-top:15px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700;color:var(--muted)}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.field textarea{min-height:100px;resize:vertical}.modalback{position:fixed;inset:0;background:#06112699;z-index:20;display:grid;place-items:center;padding:20px}.modal{width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--panel);border-radius:20px;padding:25px;box-shadow:0 25px 80px #0005}.modal h2{margin:0 0 6px}.close{float:right;background:var(--bg);color:var(--text);border-radius:9px;padding:7px 10px}.comment{padding:14px 0;border-bottom:1px solid var(--line)}.shorts-layout{display:flex;justify-content:center;gap:20px;align-items:center}.short-frame{width:min(390px,80vw);height:min(690px,75vh);background:#070b13;border-radius:22px;overflow:hidden;position:relative}.short-frame video{width:100%;height:100%;object-fit:contain}.short-overlay{position:absolute;bottom:15px;left:15px;right:15px;color:white;text-shadow:0 2px 5px #000}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:13px}.stat strong{font-size:26px;display:block}.stat span{color:var(--muted);font-size:13px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--nav);color:white;padding:12px 18px;border-radius:12px;z-index:40;box-shadow:var(--shadow)}.hidden{display:none!important}.tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:18px}.tab{padding:10px 14px;color:var(--muted);background:none;border-bottom:2px solid transparent}.tab.active{color:var(--blue);border-color:var(--blue)}.banner{height:150px;border-radius:18px;background:linear-gradient(115deg,#0d1b36,#246bfe 75%,#82aaff);margin-bottom:-38px}.channel-head{display:flex;align-items:end;gap:16px;padding:0 20px 18px}.channel-head .channel-avatar{width:84px;height:84px;border:5px solid var(--panel);font-size:24px}.adminnav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.adminnav button{padding:9px 13px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:700}.adminnav button.active{background:var(--blue2);color:var(--blue);border-color:var(--blue)}.adminrow{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.adminrow:last-child{border:0}.adminrow .grow{flex:1;min-width:180px}.warning{border:1px solid #e8b65c;background:#fff7e5;color:#745016;border-radius:13px;padding:14px;margin:15px 0}.adminsearch{max-width:420px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}.mobilemenu{display:none}
@media(max-width:900px){aside{width:72px;padding:15px 8px}.navitem{justify-content:center;padding:12px 4px}.navitem span:last-child,.navlabel,.sidefoot{display:none}.watch{grid-template-columns:1fr}.top{gap:10px;padding:0 12px}.brand{font-size:17px}.top-actions{gap:5px}}
@media(max-width:600px){.top{height:60px}.layout{min-height:calc(100vh - 60px)}aside{position:fixed;z-index:8;top:auto;bottom:0;height:60px;width:100%;display:flex;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:5px;background:var(--panel)}.navitem{margin:0;flex:1}.navitem:nth-of-type(n+6){display:none}main{padding:20px 14px 85px}.top .search{max-width:none}.top-actions .iconbtn:first-child{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 11px}.thumb{border-radius:11px}.video-meta{gap:7px}.channel-avatar{width:30px;height:30px}.video-title{font-size:13px}.muted{font-size:11px}.pagehead h1{font-size:24px}.watch h2{font-size:19px}.top-actions .btn{padding:8px}.brandmark{width:30px}.short-frame{height:65vh}.channel-head{padding-left:8px}}
</style></head>
<body><header class="top"><div class="brand"><div class="brandmark"></div>SAFE<span style="color:var(--blue)">TUBE</span></div>
<form class="search" id="searchForm"><input id="searchInput" placeholder="Search videos, channels and creators…" autocomplete="off"><button>Search</button></form>
<div class="top-actions"><button class="iconbtn" id="themeBtn" title="Toggle theme">☾</button><button class="iconbtn" id="uploadBtn" title="Upload">＋</button><button class="iconbtn" id="notifBtn" title="Notifications">♧</button><button class="btn" id="authBtn">Sign in</button><button class="avatar hidden" id="profileBtn">?</button></div></header>
<div class="layout"><aside id="sidebar">
<div class="navlabel">DISCOVER</div>
<a class="navitem active" data-page="home"><span>⌂</span><span>Home</span></a><a class="navitem" data-page="shorts"><span>▣</span><span>Shorts</span></a><a class="navitem" data-page="subscriptions"><span>▤</span><span>Subscriptions</span></a><a class="navitem" data-page="explore"><span>⌕</span><span>Explore</span></a><a class="navitem" data-page="trending"><span>↗</span><span>Trending</span></a>
<div class="navlabel">YOU</div><a class="navitem" data-page="history"><span>◷</span><span>History</span></a><a class="navitem" data-page="liked"><span>♡</span><span>Liked videos</span></a><a class="navitem" data-page="playlists"><span>▧</span><span>Playlists</span></a><a class="navitem" data-page="channel"><span>◉</span><span>Your channel</span></a><a class="navitem" data-page="studio"><span>▦</span><span>Creator Studio</span></a><a class="navitem" data-page="settings"><span>⚙</span><span>Settings</span></a><a class="navitem" data-page="admin"><span>▣</span><span>Family Admin</span></a>
<div class="sidefoot">Watch what matters.<br>Take control of your time.<br><br>© SAFETUBE · Local preview</div></aside><main id="app"></main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const KEY='safetube_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'{}');
db.user??=null;db.videos??=[];db.likes??=[];db.dislikes??=[];db.subs??=[];db.history??=[];db.playlists??=[];db.comments??=[];db.reports??=[];db.blocked??=[];db.theme??='light';db.prefs??={autoplay:false,personalized:true};
let page='home',category='All',activeVideo=null,shortIndex=0,searchTerm='',adminTab='overview',adminQuery='';
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(t){$('#toastRoot').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>$('#toastRoot').innerHTML='',2600);}
function signed(){return !!db.user}
function gate(){if(signed())return true;modal(`<h2>Join SAFETUBE!</h2><p class="sub">Sign in or create an account to interact with creators and become part of the community.</p><div class="row" style="margin-top:22px"><button class="btn" onclick="authForm('signin')">Sign In</button><button class="btn secondary" onclick="authForm('signup')">Create Account</button><button class="btn ghost" onclick="closeModal()">Maybe Later</button></div>`);return false;}
function modal(html){$('#modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button>${html}</div></div>`;}
function closeModal(){$('#modalRoot').innerHTML='';}
function authForm(mode){modal(`<h2>${mode==='signin'?'Welcome back':'Create your account'}</h2><p class="sub">Local preview account · credentials stay in this browser only.</p><form id="authForm"><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" required></div>${mode==='signup'?'<div class="field"><label>Display name</label><input name="name" required maxlength="40"></div>':''}<button class="btn" style="width:100%">${mode==='signin'?'Sign in':'Create account'}</button></form><p class="muted" style="margin-top:15px">This prototype does not provide real email verification or secure server authentication.</p><button class="btn ghost" onclick="authForm('${mode==='signin'?'signup':'signin'}')">${mode==='signin'?'Create an account':'I already have an account'}</button>`);$('#authForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),email=f.get('email').toLowerCase(),password=f.get('password');if(mode==='signup'){db.user={email,name:f.get('name'),password,channel:null};}else{if(!db.user||db.user.email!==email||db.user.password!==password){toast('Account not found in this browser.');return;} }save();closeModal();syncHeader();render();toast(mode==='signin'?'Signed in':'Account created');};}
function syncHeader(){$('#authBtn').classList.toggle('hidden',signed());$('#profileBtn').classList.toggle('hidden',!signed());$('#profileBtn').textContent=signed()?(db.user.name||'U')[0].toUpperCase():'?';document.documentElement.dataset.theme=db.theme;}
function fmt(n){return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n||0)}
function ago(ts){let d=Math.max(0,Date.now()-ts),days=Math.floor(d/86400000);return days?days+' days ago':Math.floor(d/3600000)?Math.floor(d/3600000)+' hours ago':'Just now'}
function seed(){if(db.videos.length)return;db.videos=[
{id:'s1',title:'A calmer way to organize your week',creator:'Northstar Notes',avatar:'N',category:'Education',description:'A practical, gentle approach to planning your week without overloading your schedule.',views:12400,created:Date.now()-86400000*2,duration:'08:42',art:'linear-gradient(135deg,#213c68,#72a5ff)',sample:true},
{id:'s2',title:'Building a tiny Minecraft village',creator:'Block & Birch',avatar:'B',category:'Minecraft',description:'A cozy build with paths, gardens and a little market square.',views:88200,created:Date.now()-86400000*4,duration:'14:18',art:'linear-gradient(135deg,#236b50,#a3d18a)',sample:true},
{id:'s3',title:'The science of ocean waves',creator:'Curious Current',avatar:'C',category:'Education',description:'Explore how wind, energy and coastlines shape waves.',views:53200,created:Date.now()-86400000*6,duration:'11:06',art:'linear-gradient(135deg,#07516f,#54c2db)',sample:true},
{id:'s4',title:'Sketchbook tour: little creatures',creator:'Mira Makes',avatar:'M',category:'Animation',description:'A look through a collection of original character sketches.',views:19700,created:Date.now()-86400000*1,duration:'06:31',art:'linear-gradient(135deg,#714a8c,#ef9eaf)',sample:true},
{id:'s5',title:'Five useful browser shortcuts',creator:'Byte Sized',avatar:'B',category:'Technology',description:'Small keyboard shortcuts that make everyday browsing smoother.',views:9100,created:Date.now()-3600000*8,duration:'04:52',art:'linear-gradient(135deg,#24324b,#8097b8)',sample:true},
{id:'s6',title:'A peaceful walk through the forest',creator:'Field Notes',avatar:'F',category:'Animals',description:'Ambient forest sounds and a slow walk along a woodland path.',views:44500,created:Date.now()-86400000*9,duration:'09:24',art:'linear-gradient(135deg,#25543b,#9ebd83)',sample:true}];save();}
function videoCard(v){let art=v.art||'linear-gradient(135deg,#213c68,#72a5ff)';return `<article class="video-card" onclick="watch('${v.id}')"><div class="thumb" style="background:${art}">${v.thumb?`<img src="${v.thumb}">`:`<span class="play">▶</span>`}<span class="duration">${esc(v.duration||'—')}</span></div><div class="video-meta"><div class="channel-avatar">${esc(v.avatar||v.creator?.[0]||'S')}</div><div style="min-width:0"><p class="video-title">${esc(v.title)}</p><div class="muted">${esc(v.creator)}${v.sample?' · Sample':''}</div><div class="muted">${fmt(v.views)} views · ${ago(v.created)}</div></div></div></article>`}
function allVideos(){return [...db.videos].filter(v=>!v.deleted&&v.visibility!=='private'&&!db.blocked.includes(v.creator));}
function heading(title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">SAFETUBE / ${page.toUpperCase()}</div><h1>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function render(){syncHeader();$('.navitem.active')?.classList.remove('active');$(`[data-page="${page}"]`)?.classList.add('active');if(page==='home'||page==='explore'||page==='trending'||page==='subscriptions'||page==='liked'||page==='history')renderFeed();else if(page==='shorts')renderShorts();else if(page==='watch')renderWatch();else if(page==='channel')renderChannel();else if(page==='studio')renderStudio();else if(page==='playlists')renderPlaylists();else if(page==='settings')renderSettings();else if(page==='search')renderSearch();else if(page==='notifications')renderNotifications();else if(page==='admin')renderAdmin();}
function renderFeed(){let vids=allVideos();if(page==='subscriptions'){if(!signed()){app.innerHTML=heading('Subscriptions','Sign in to keep up with your channels.')+'<div class="empty"><strong>Your subscriptions live here</strong><button class="btn" onclick="gate()">Sign in</button></div>';return;}vids=vids.filter(v=>db.subs.includes(v.creator));}
if(page==='liked'){if(!signed()){app.innerHTML=heading('Liked videos','Your saved likes.')+'<div class="empty"><strong>Sign in to see liked videos</strong><button class="btn" onclick="gate()">Sign in</button></div>';return;}vids=vids.filter(v=>db.likes.includes(v.id));}
if(page==='history'){if(!signed()){app.innerHTML=heading('History','Your recently watched videos.')+'<div class="empty"><strong>Sign in to see watch history</strong><button class="btn" onclick="gate()">Sign in</button></div>';return;}vids=db.history.map(id=>db.videos.find(v=>v.id===id)).filter(Boolean);}
if(page==='trending')vids.sort((a,b)=>b.views-a.views);
if(page==='explore')vids.sort((a,b)=>b.created-a.created);
if(page==='home')vids.sort((a,b)=>b.created-a.created);
let cats=['All','Gaming','Minecraft','Music','Entertainment','Education','Technology','Animals','Sports','Animation','News','Other'];if(category!=='All')vids=vids.filter(v=>v.category===category);
app.innerHTML=heading(page==='home'?'Watch what matters.':page==='trending'?'Trending':page==='explore'?'Explore':page==='subscriptions'?'Subscriptions':page==='liked'?'Liked videos':'Watch history',page==='home'?'Thoughtful videos, chosen by you. No autoplay.':'Browse at your own pace.',`<button class="btn" onclick="openUpload()">＋ Upload</button>`)+(page==='home'?`<div class="chips">${cats.map(c=>`<button class="chip ${category===c?'active':''}" onclick="category='${c}';render()">${c}</button>`).join('')}</div>`:'')+`<div class="grid">${vids.length?vids.map(videoCard).join(''):'<div class="empty" style="grid-column:1/-1"><strong>Nothing here just yet</strong>Try another category or upload your first video.</div>'}</div>${page==='home'?'<p class="muted" style="margin-top:35px">You’re all caught up. Choose a category or search for something specific.</p>':''}`;}
function watch(id){let v=db.videos.find(x=>x.id===id);if(!v)return;activeVideo=v;page='watch';if(signed()){db.history=[id,...db.history.filter(x=>x!==id)].slice(0,100);save();}render();}
function renderWatch(){let v=activeVideo;if(!v){page='home';render();return;}let liked=db.likes.includes(v.id),dis=db.dislikes.includes(v.id),related=allVideos().filter(x=>x.id!==v.id).slice(0,5),comments=db.comments.filter(c=>c.video===v.id);app.innerHTML=`<div class="watch"><section><div class="player">${v.file?`<video src="${v.file}" controls playsinline preload="metadata"></video>`:`<div style="color:white;text-align:center;padding:20px"><div style="font-size:48px">▶</div><b>${esc(v.title)}</b><p style="opacity:.7">Sample preview · Upload a video to play your own media</p></div>`}</div><h2>${esc(v.title)}</h2><div class="row" style="justify-content:space-between"><div class="row"><div class="channel-avatar">${esc(v.avatar||'S')}</div><div><b>${esc(v.creator)}</b><div class="muted">${fmt(v.views)} views · ${ago(v.created)}</div></div><button class="btn" onclick="subscribe('${esc(v.creator)}')">${db.subs.includes(v.creator)?'Subscribed':'Subscribe'}</button></div><div class="row"><button class="btn secondary" onclick="like('${v.id}')">♡ ${liked?'Liked':'Like'}</button><button class="btn ghost" onclick="dislike('${v.id}')">↘ ${dis?'Disliked':'Dislike'}</button><button class="btn ghost" onclick="share('${v.id}')">↗ Share</button><button class="btn ghost" onclick="saveLater('${v.id}')">＋ Save</button><button class="btn ghost" onclick="report('video','${v.id}')">⚑ Report</button></div></div><div class="desc"><b>${esc(v.category)} ${v.sample?'· Sample content':''}</b><p>${esc(v.description||'No description provided.')}</p></div><section style="margin-top:25px"><h3>Comments · ${comments.length}</h3>${signed()?`<form id="commentForm" class="row"><input name="text" required maxlength="500" placeholder="Add a thoughtful comment…" style="flex:1;min-width:150px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text)"><button class="btn">Comment</button></form>`:`<button class="btn secondary" onclick="gate()">Sign in to comment</button>`}${comments.map(c=>`<div class="comment"><b>${esc(c.name)}</b><p>${esc(c.text)}</p><div class="muted">${ago(c.created)} ${c.owner===db.user?.email?'· Your comment':''}</div></div>`).join('')||'<p class="muted">Be the first to comment.</p>'}</section></section><aside style="position:static;width:auto;height:auto;border:0;background:transparent;padding:0"><h3 style="margin-top:0">Up next · by choice</h3>${related.map(v=>`<div style="margin-bottom:15px">${videoCard(v)}</div>`).join('')}</aside></div>`;
$('#commentForm')?.addEventListener('submit',e=>{e.preventDefault();if(!gate())return;let text=new FormData(e.target).get('text').trim();if(!text)return;db.comments.push({video:v.id,text,name:db.user.name,owner:db.user.email,created:Date.now()});save();renderWatch();});}
function like(id){if(!gate())return;db.likes=db.likes.includes(id)?db.likes.filter(x=>x!==id):[...db.likes,id];db.dislikes=db.dislikes.filter(x=>x!==id);save();renderWatch();}
function dislike(id){if(!gate())return;db.dislikes=db.dislikes.includes(id)?db.dislikes.filter(x=>x!==id):[...db.dislikes,id];db.likes=db.likes.filter(x=>x!==id);save();renderWatch();}

function report(type,id){if(!gate())return;modal(`<h2>Report ${type}</h2><p class="sub">Tell our moderation team what concerns you.</p><form id="reportForm"><div class="field"><label>Reason</label><select name="reason"><option>Harassment or bullying</option><option>Spam or misleading content</option><option>Inappropriate content</option><option>Privacy concern</option><option>Other</option></select></div><div class="field"><label>Additional context (optional)</label><textarea name="detail" maxlength="500"></textarea></div><button class="btn">Submit report</button></form>`);$('#reportForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.reports.push({type,id,reason:f.get('reason'),detail:f.get('detail'),created:Date.now()});save();closeModal();toast('Report saved for review in this local preview.');};}
function renderShorts(){let list=allVideos().filter(v=>v.kind==='short');if(!list.length){app.innerHTML=heading('Shorts','Short videos, on your terms.')+'<div class="empty"><strong>No Shorts yet</strong>Upload a Short up to 180 seconds to see it here.<br><br><button class="btn" onclick="openUpload(true)">Upload a Short</button></div>';return;}shortIndex=Math.min(shortIndex,list.length-1);let v=list[shortIndex];app.innerHTML=heading('Shorts','Manual navigation only · no autoplay or endless feed.')+`<div class="shorts-layout"><button class="btn ghost" onclick="moveShort(-1)">↑ Previous</button><div class="short-frame">${v.file?`<video controls playsinline src="${v.file}"></video>`:`<div style="height:100%;display:grid;place-items:center;color:white;background:${v.art}">Sample Short</div>`}<div class="short-overlay"><b>${esc(v.creator)}</b><div>${esc(v.title)}</div></div></div><button class="btn ghost" onclick="moveShort(1)">Next ↓</button></div><div class="row" style="justify-content:center;margin-top:15px"><button class="btn secondary" onclick="like('${v.id}')">♡ Like</button><button class="btn ghost" onclick="share('${v.id}')">Share</button><button class="btn ghost" onclick="report('Short','${v.id}')">Report</button><button class="btn ghost" onclick="page='home';render()">Exit Shorts</button></div>`;}
function moveShort(n){let list=allVideos().filter(v=>v.kind==='short');shortIndex=Math.max(0,Math.min(list.length-1,shortIndex+n));renderShorts();}
function openUpload(short=false){if(!gate())return;modal(`<h2>${short?'Upload a Short':'Upload a video'}</h2><p class="sub">Files are stored locally in this browser for this prototype.</p><form id="uploadForm"><div class="field"><label>Video file (MP4 or WebM)</label><input name="file" type="file" accept="video/mp4,video/webm" required></div><div class="field"><label>Title</label><input name="title" required maxlength="100"></div><div class="field"><label>Description</label><textarea name="description" maxlength="3000"></textarea></div><div class="field"><label>Category</label><select name="category">${['Gaming','Minecraft','Music','Entertainment','Education','Technology','Animals','Sports','Animation','News','Other'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Visibility</label><select name="visibility"><option>public</option><option>unlisted</option><option>private</option></select></div><div class="field"><label>Thumbnail (optional)</label><input name="thumb" type="file" accept="image/*"></div><button class="btn">Save upload</button></form>`);$('#uploadForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get('file');if(file.size>250*1024*1024){toast('For this preview, files must be under 250 MB.');return;}let duration=0;try{duration=await getDuration(file);}catch{}if(short&&duration>180){toast('Shorts must be 180 seconds or shorter.');return;}let thumb=f.get('thumb'),v={id:'u'+Date.now(),title:f.get('title'),creator:db.user.name,avatar:(db.user.name||'U')[0].toUpperCase(),category:f.get('category'),description:f.get('description'),views:0,created:Date.now(),duration:duration?Math.floor(duration/60)+':'+String(Math.floor(duration%60)).padStart(2,'0'):'—',file:URL.createObjectURL(file),fileName:file.name,thumb:thumb?.size?URL.createObjectURL(thumb):null,visibility:f.get('visibility'),kind:short?'short':'video',owner:db.user.email};db.videos.unshift(v);save();closeModal();toast('Video added to this browser.');page='studio';render();};}
function getDuration(file){return new Promise((res,rej)=>{let u=URL.createObjectURL(file),v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{let d=v.duration;URL.revokeObjectURL(u);res(d)};v.onerror=rej;v.src=u;});}
function renderSearch(){let q=searchTerm.toLowerCase(),vs=allVideos().filter(v=>(v.title+' '+v.creator+' '+v.category+' '+v.description).toLowerCase().includes(q));app.innerHTML=heading('Search results',`Results for “${esc(searchTerm)}”`)+`<div class="grid">${vs.length?vs.map(videoCard).join(''):'<div class="empty"><strong>No results found</strong>Try a different search term.</div>'}</div>`;}
function renderChannel(){if(!signed()){app.innerHTML=heading('Your channel','Create a channel to share videos.')+'<div class="empty"><strong>Your creator journey starts here</strong><button class="btn" onclick="gate()">Sign in</button></div>';return;}let c=db.user.channel;if(!c){app.innerHTML=heading('Your channel','Set up your public creator profile.')+`<div class="panel" style="max-width:600px"><form id="channelForm"><div class="field"><label>Channel name</label><input name="name" required maxlength="50" value="${esc(db.user.name)}"></div><div class="field"><label>@Username</label><input name="handle" required pattern="[A-Za-z0-9_]{3,20}" placeholder="yourname"></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Category</label><select name="category"><option>Education</option><option>Gaming</option><option>Entertainment</option><option>Technology</option><option>Other</option></select></div><button class="btn">Create channel</button></form></div>`;$('#channelForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.user.channel={name:f.get('name'),handle:f.get('handle'),description:f.get('description'),category:f.get('category')};save();renderChannel();};return;}let own=db.videos.filter(v=>v.owner===db.user.email);app.innerHTML=`<div class="banner"></div><div class="panel" style="padding:0"><div class="channel-head"><div class="channel-avatar">${esc(c.name[0])}</div><div style="flex:1"><h2 style="margin:0">${esc(c.name)}</h2><div class="muted">@${esc(c.handle)} · ${db.subs.filter(x=>x===c.name).length} subscribers</div></div><button class="btn secondary" onclick="editChannel()">Edit channel</button></div></div><p class="sub" style="margin:18px 0 25px">${esc(c.description)}</p><h2>Your videos</h2><div class="grid">${own.length?own.map(videoCard).join(''):'<div class="empty"><strong>No uploads yet</strong><button class="btn" onclick="openUpload()">Upload your first video</button></div>'}</div>`;}
function editChannel(){let c=db.user.channel;modal(`<h2>Edit channel</h2><form id="editChannel"><div class="field"><label>Channel name</label><input name="name" value="${esc(c.name)}" required></div><div class="field"><label>Description</label><textarea name="description">${esc(c.description)}</textarea></div><button class="btn">Save changes</button></form>`);$('#editChannel').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);c.name=f.get('name');c.description=f.get('description');save();closeModal();renderChannel();};}
function renderStudio(){if(!signed()){app.innerHTML=heading('Creator Studio','Manage your content and understand your audience.')+'<div class="empty"><strong>Sign in to open Creator Studio</strong><button class="btn" onclick="gate()">Sign in</button></div>';return;}let own=db.videos.filter(v=>v.owner===db.user.email);app.innerHTML=heading('Creator Studio','A clear view of your channel activity.',`<button class="btn" onclick="openUpload()">＋ Upload</button>`)+`<div class="stats"><div class="panel stat"><strong>${fmt(own.reduce((a,v)=>a+v.views,0))}</strong><span>Total views</span></div><div class="panel stat"><strong>${own.length}</strong><span>Uploads</span></div><div class="panel stat"><strong>${db.subs.length}</strong><span>Subscriptions</span></div><div class="panel stat"><strong>${db.comments.filter(c=>own.some(v=>v.id===c.video)).length}</strong><span>Comments</span></div></div><h2 style="margin-top:28px">Your content</h2>${own.length?`<div class="panel">${own.map(v=>`<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line)"><div style="flex:1"><b>${esc(v.title)}</b><div class="muted">${v.kind==='short'?'Short':'Video'} · ${v.visibility||'public'} · ${fmt(v.views)} views</div></div><button class="btn ghost" onclick="editVideo('${v.id}')">Edit</button><button class="btn danger" onclick="deleteVideo('${v.id}')">Delete</button></div>`).join('')}</div>`:'<div class="empty"><strong>No content yet</strong>Your uploads will appear here.</div>'}<p class="muted" style="margin-top:18px">Analytics are based only on activity recorded in this browser preview. Sample content and external viewers are not included.</p>`;}

function adminNav(){let tabs=['overview','videos','shorts','channels','comments','reports','statistics','settings'];return `<div class="adminnav">${tabs.map(t=>`<button class="${adminTab===t?'active':''}" onclick="adminTab='${t}';adminQuery='';renderAdmin()">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`;}
function adminSearch(){return `<input class="adminsearch" placeholder="Search this section…" value="${esc(adminQuery)}" oninput="adminQuery=this.value;renderAdminResults()">`;}
function renderAdmin(){
 let videos=db.videos.filter(v=>!v.deleted), shorts=videos.filter(v=>v.kind==='short'), normal=videos.filter(v=>v.kind!=='short');
 let totalViews=videos.reduce((n,v)=>n+(Number(v.views)||0),0);
 let reports=db.reports||[], comments=db.comments||[];
 let stats=`<div class="stats"><div class="panel stat"><strong>${db.user?1:0}</strong><span>Local account profiles</span></div><div class="panel stat"><strong>${db.user?.channel?1:0}</strong><span>Channels in this browser</span></div><div class="panel stat"><strong>${normal.length}</strong><span>Videos</span></div><div class="panel stat"><strong>${shorts.length}</strong><span>Shorts</span></div><div class="panel stat"><strong>${comments.length}</strong><span>Comments</span></div><div class="panel stat"><strong>${fmt(totalViews)}</strong><span>Recorded views</span></div><div class="panel stat"><strong>${reports.filter(r=>!r.resolved).length}</strong><span>Open reports</span></div></div>`;
 let content='';
 if(adminTab==='overview') content=stats+`<div class="panel" style="margin-top:18px"><h3>Family activity snapshot</h3><p class="muted">These counts come only from this browser's local SAFETUBE data. They are not global platform statistics.</p><div class="adminrow"><div class="grow"><b>Open reports</b><div class="muted">Items awaiting family review</div></div><button class="btn secondary" onclick="adminTab='reports';renderAdmin()">Review reports (${reports.filter(r=>!r.resolved).length})</button></div><div class="adminrow"><div class="grow"><b>Content library</b><div class="muted">${videos.length} total local uploads</div></div><button class="btn secondary" onclick="adminTab='videos';renderAdmin()">Manage videos</button></div></div>`;
 if(adminTab==='videos'||adminTab==='shorts'){
   let list=adminTab==='shorts'?shorts:normal;
   content=adminSearch()+`<div id="adminResults" class="panel" style="margin-top:14px">${adminVideoRows(list)}</div>`;
 }
 if(adminTab==='channels'){
   let c=db.user?.channel;
   content=`<div class="panel">${c?`<div class="adminrow"><div class="channel-avatar">${esc(c.name[0]||'S')}</div><div class="grow"><b>${esc(c.name)}</b><div class="muted">@${esc(c.handle||'')} · owned by ${esc(db.user.email)}</div></div><button class="btn secondary" onclick="adminEditChannel()">Edit</button><button class="btn danger" onclick="adminRemoveChannel()">Remove channel</button></div>`:'<div class="empty"><strong>No local channels</strong>Channels created in this browser appear here.</div>'}</div>`;
 }
 if(adminTab==='comments'){

 }
 if(adminTab==='reports'){
   content=`<div class="panel">${reports.length?reports.slice().reverse().map((r,i)=>`<div class="adminrow"><div class="grow"><b>${esc(r.type)} report · ${esc(r.reason)}</b><div class="muted">Target: ${esc(r.id)} · ${ago(r.created)} · ${r.resolved?'Resolved':'Open'}</div><p>${esc(r.detail||'No extra details')}</p></div>${!r.resolved?`<button class="btn secondary" onclick="resolveReport(${reports.length-1-i})">Mark resolved</button>`:''}<button class="btn danger" onclick="adminRemoveReported('${esc(r.type)}','${esc(r.id)}')">Remove reported item</button></div>`).join(''):'<div class="empty"><strong>No reports yet</strong>Reports submitted in this browser will appear here.</div>'}</div>`;
 }
 if(adminTab==='statistics') content=stats+`<div class="panel" style="margin-top:16px"><h3>Data notes</h3><p class="muted">The current prototype records sample-video view counts and local comments/reports. It does not track watch time, historical growth, unique visitors, or activity from other devices, so those charts are not available without a shared backend and event tracking.</p></div>`;
 if(adminTab==='settings') content=`<div class="panel"><h3>Family Admin information</h3><p>This dashboard is intentionally available at <code>#/admin</code> without a separate account, matching the family-project brief.</p><div class="warning"><b>Important security limitation:</b> this is a public static website. Anyone can open this route, and browser-only controls cannot securely authorize changes. Do not use it to manage private user data or rely on it for real moderation. A shared hosted backend with server-enforced permissions is required for secure multi-device administration.</div><p class="muted">All changes here affect only the local data stored in this browser. GitHub Pages does not provide a database.</p><button class="btn danger" onclick="if(confirm('Clear all SAFETUBE local data in this browser? This cannot be undone.')){localStorage.removeItem(KEY);location.hash='';location.reload()}">Reset local SAFETUBE data</button></div>`;
 app.innerHTML=heading('SAFETUBE FAMILY ADMIN','Family moderation and content controls · local browser data only')+`<div class="warning"><b>Local prototype — not secure administration.</b> There is no administrator login because this is a static GitHub Pages prototype. Anyone can access this dashboard. Changes are saved only in this browser and are not shared with family members or other devices.</div>`+adminNav()+content;
}
function adminVideoRows(list){return list.length?list.filter(v=>(v.title+' '+v.creator+' '+v.id).toLowerCase().includes(adminQuery.toLowerCase())).map(v=>`<div class="adminrow"><div class="grow"><b>${esc(v.title)}</b><div class="muted">${esc(v.creator)} · ${v.kind==='short'?'Short':'Video'} · ${esc(v.visibility||'public')} · ${fmt(v.views)} views</div></div><button class="btn secondary" onclick="adminEditVideo('${v.id}')">Edit</button><button class="btn danger" onclick="adminDeleteVideo('${v.id}')">Remove</button></div>`).join('')||'<p class="muted">No matching content.</p>':'<div class="empty"><strong>No content</strong>Local uploads appear here.</div>';}
function adminCommentRows(list){return list.filter(c=>(c.text+' '+c.name+' '+c.video).toLowerCase().includes(adminQuery.toLowerCase())).map((c)=>`<div class="adminrow"><div class="grow"><b>${esc(c.name)}</b><p>${esc(c.text)}</p><div class="muted">Video: ${esc(c.video)} · ${ago(c.created)}</div></div><button class="btn danger" onclick="adminDeleteComment('${esc(c.video)}',${c.created})">Remove</button></div>`).join('')||'<div class="empty"><strong>No matching comments</strong></div>';}

function adminEditVideo(id){let v=db.videos.find(x=>x.id===id);if(!v)return;modal(`<h2>Edit content</h2><form id="adminEditVideo"><div class="field"><label>Title</label><input name="title" value="${esc(v.title)}" required></div><div class="field"><label>Description</label><textarea name="description">${esc(v.description||'')}</textarea></div><div class="field"><label>Visibility</label><select name="visibility"><option ${v.visibility==='public'?'selected':''}>public</option><option ${v.visibility==='unlisted'?'selected':''}>unlisted</option><option ${v.visibility==='private'?'selected':''}>private</option></select></div><button class="btn">Save changes</button></form>`);$('#adminEditVideo').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);Object.assign(v,{title:f.get('title'),description:f.get('description'),visibility:f.get('visibility')});save();closeModal();renderAdmin();toast('Local content updated');};}
function adminDeleteVideo(id){if(!confirm('Remove this content from local SAFETUBE data?'))return;db.videos=db.videos.filter(v=>v.id!==id);save();renderAdmin();toast('Content removed locally');}

function adminRemoveReported(type,id){if(!confirm('Remove this reported item if it exists in local data?'))return;if(type.toLowerCase().includes('comment'))db.comments=db.comments.filter(c=>c.video!==id);else db.videos=db.videos.filter(v=>v.id!==id);save();renderAdmin();toast('Local item removal attempted');}
function adminEditChannel(){if(!db.user?.channel)return;editChannel();}
function adminRemoveChannel(){if(!confirm('Remove the local channel profile? Uploaded videos will remain.'))return;db.user.channel=null;save();renderAdmin();toast('Channel removed locally');}
function init(){seed();syncHeader();if(location.hash==='#/admin'||location.hash==='#/admin/')page='admin';let hash=location.hash.match(/video=([^&]+)/);if(hash){let v=db.videos.find(v=>v.id===decodeURIComponent(hash[1]));if(v){activeVideo=v;page='watch';}}render();}
init();
</script></body></html>
